<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate 1 — VRAM 계산: T4 16GB에 들어가는가</title>
<style>
  :root{
    --bg:#10161F; --panel:#1A2230; --panel2:#151C28; --line:#2B3648;
    --text:#E8EDF5; --muted:#8B98AC; --faint:#5C6980;
    --asr:#4C8DAE; --llm:#C48A3F; --tts:#7A9E6E; --cuda:#5B6472;
    --pass:#58B77E; --fail:#E4585A;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .stage{width:100%;max-width:920px}

  /* ── 헤더 ─────────────────────────────── */
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase}
  h1{font-size:21px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
  h1 .q{color:var(--muted);font-weight:500}
  .controls{display:flex;gap:8px}
  button{
    font-family:var(--sans);font-size:14px;font-weight:600;color:var(--text);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:9px 16px;cursor:pointer;transition:border-color .15s, background .15s;
  }
  button:hover:not(:disabled){border-color:var(--muted)}
  button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:#232E40}

  /* ── 모델 선택기 ───────────────────────── */
  .picker{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
  .pickRow{display:flex;align-items:flex-start;gap:12px}
  .pickLabel{flex:0 0 46px;padding-top:7px;display:flex;align-items:center;gap:7px;
    font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--muted)}
  .pickLabel i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    font-family:var(--sans);font-size:13px;font-weight:500;color:var(--muted);
    background:transparent;border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;cursor:pointer;transition:all .15s;
  }
  .chip .gb{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:5px}
  .chip:hover:not(:disabled){border-color:var(--muted);color:var(--text)}
  .chip:focus-visible{outline:2px solid var(--text);outline-offset:2px}
  .chip:disabled{opacity:.4;cursor:default}
  .chip.sel{color:var(--text);border-color:var(--chipc);
    background:color-mix(in srgb, var(--chipc) 16%, transparent)}
  .chip.sel .gb{color:var(--text)}

  /* ── 본문 2단 ─────────────────────────── */
  .board{display:grid;grid-template-columns:280px 1fr;gap:20px}
  @media (max-width:680px){.board{grid-template-columns:1fr}}

  .gaugeWrap{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px}
  .gauge{position:relative;height:560px;margin:0 auto;width:170px}
  .tickline{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
  .ticklabel{position:absolute;right:calc(100% + 8px);transform:translateY(-50%);
    font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap}
  .tank{position:absolute;left:24px;right:0;bottom:0;border:1px solid var(--line);
    border-top:none;background:rgba(255,255,255,.015)}
  .danger{position:absolute;left:24px;right:0;opacity:0;transition:opacity .5s;
    background:repeating-linear-gradient(-45deg,transparent 0 8px,rgba(228,88,90,.10) 8px 16px)}
  .rim{position:absolute;left:12px;right:-6px;border-top:2px dashed var(--fail);transition:filter .2s}
  .rim .tag{position:absolute;right:0;bottom:4px;font-family:var(--mono);font-size:10.5px;
    color:var(--fail);letter-spacing:.06em}
  .rim.flash{animation:rimflash .55s ease-in-out 3}
  @keyframes rimflash{50%{filter:brightness(1.9) drop-shadow(0 0 6px rgba(228,88,90,.8))}}
  .stack{position:absolute;left:24px;right:0;bottom:0;display:flex;flex-direction:column-reverse}
  .seg{width:100%;height:0;overflow:hidden;position:relative;
    transition:height .7s cubic-bezier(.25,.9,.35,1)}
  .seg .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.85);white-space:nowrap}
  .seg.margin{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.16) 0 6px,rgba(255,255,255,.04) 6px 12px)}
  .readout{margin-top:12px;text-align:center}
  .readout .num{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.02em}
  .readout .num .unit{font-size:14px;color:var(--muted);font-weight:500}
  .readout .cap{font-size:11.5px;color:var(--faint);margin-top:2px;min-height:15px}

  .log{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column}
  .comboName{font-size:14px;color:var(--muted);min-height:20px;margin-bottom:12px}
  .comboName b{color:var(--text)}
  table{width:100%;border-collapse:collapse}
  td{padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px;
    color:var(--faint);transition:color .3s}
  td.gb{font-family:var(--mono);text-align:right;white-space:nowrap}
  td.dot{width:22px}
  td.dot span{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--line);transition:background .3s}
  tr.on td{color:var(--text)}
  tr.warn td{color:var(--fail)}
  .formula{margin-top:auto;padding-top:16px;font-family:var(--mono);font-size:14.5px;line-height:1.9;color:var(--faint)}
  .formula .v{color:var(--text);opacity:0;transition:opacity .4s}
  .formula .v.show{opacity:1}
  .formula .note{display:block;font-family:var(--sans);font-size:12px;min-height:18px;color:var(--fail);opacity:0;transition:opacity .4s}
  .formula .note.show{opacity:1}
  .formula .note.info{color:var(--muted)}

  .verdict{margin-top:14px;min-height:64px;display:flex;align-items:center;justify-content:center}
  .stamp{font-size:20px;font-weight:800;letter-spacing:.04em;padding:10px 26px;border-radius:10px;
    border:2.5px solid;transform:rotate(-3deg) scale(1.6);opacity:0;
    transition:transform .35s cubic-bezier(.2,1.6,.4,1), opacity .25s}
  .stamp.show{opacity:1;transform:rotate(-3deg) scale(1)}
  .stamp.pass{color:var(--pass);border-color:var(--pass);background:rgba(88,183,126,.08)}
  .stamp.fail{color:var(--fail);border-color:var(--fail);background:rgba(228,88,90,.08)}

  footer{margin-top:14px;font-size:11.5px;color:var(--faint)}
  footer code{font-family:var(--mono)}
  @media (prefers-reduced-motion: reduce){
    .seg,.stamp,.formula .v,.danger{transition:none}
    .rim.flash{animation:none;filter:brightness(1.6)}
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div>
      <div class="eyebrow">7-1 · Gate 1 · 판정식 = 합계 × 1.2 + 1.5GB ≤ 16GB</div>
      <h1>VRAM 계산 <span class="q">— T4 16GB에 들어가는가</span></h1>
    </div>
    <div class="controls">
      <button id="btnPlay" class="primary">▶ 이 조합 재생</button>
      <button id="btnA">프리셋 A</button>
      <button id="btnB">프리셋 B</button>
      <button id="btnR">초기화</button>
    </div>
  </header>

  <div class="picker" id="picker">
    <div class="pickRow">
      <div class="pickLabel"><i style="background:var(--asr)"></i>ASR</div>
      <div class="chips" id="chipsAsr"></div>
    </div>
    <div class="pickRow">
      <div class="pickLabel"><i style="background:var(--llm)"></i>LLM</div>
      <div class="chips" id="chipsLlm"></div>
    </div>
    <div class="pickRow">
      <div class="pickLabel"><i style="background:var(--tts)"></i>TTS</div>
      <div class="chips" id="chipsTts"></div>
    </div>
  </div>

  <div class="board">
    <div class="gaugeWrap">
      <div class="gauge" id="gauge">
        <div class="danger" id="danger"></div>
        <div class="tank" id="tank"></div>
        <div class="stack" id="stack"></div>
        <div class="rim" id="rim"><span class="tag">T4 한계 16 GB</span></div>
      </div>
      <div class="readout">
        <div class="num"><span id="total">0.0</span> <span class="unit">GB</span></div>
        <div class="cap" id="cap">모델을 고르고 ▶ 재생을 누르세요</div>
      </div>
    </div>

    <div class="log">
      <div class="comboName" id="comboName">&nbsp;</div>
      <table id="rows"></table>
      <div class="formula">
        합계 <span class="v" id="fSum">·</span>
        &nbsp;× 1.2 <span class="v" id="fMargin">·</span>
        &nbsp;+ CUDA 1.5 <span class="v" id="fCuda">·</span><br>
        = <span class="v" id="fNeed">·</span> &nbsp;vs&nbsp; 16.0 GB
        <span class="note" id="fNote"></span>
      </div>
      <div class="verdict"><div class="stamp" id="stamp"></div></div>
    </div>
  </div>

  <footer>수치는 과정 세션 실측 기반 근사값입니다 — 확정 전 <code>V1</code>(모델 카드)·<code>V3</code>(T4 실측) 재검증 의무. Gate 1 통과가 곧 채택은 아닙니다 — 지연(Gate 2)·라이선스(Gate 3)가 남아 있습니다.</footer>
</div>

<script>
(function(){
  "use strict";
  // ── 스케일: 게이지 560px = 32GB (최악 조합 29.9GB가 눈금 안에 들어오도록)
  var H = 560, MAXGB = 32, PX = H / MAXGB, T4 = 16.0;

  // ── 노트북 MODEL_CATALOG의 VRAM 수치 그대로 (근사값)
  var CATALOG = {
    asr: [
      {label:"faster-whisper-small(int8)",          gb:0.7},
      {label:"SenseVoice-Small(fp16)",              gb:0.9},
      {label:"faster-whisper-medium(int8)",         gb:1.2},
      {label:"faster-whisper-large-v3-turbo(int8)", gb:1.5},
      {label:"faster-whisper-large-v3",             gb:3.2}
    ],
    llm: [
      {label:"EXAONE-4.0-1.2B(fp16)", gb:2.6},
      {label:"Midm-2.0-Mini(fp16)",   gb:4.8},
      {label:"Bllossom-3B(fp16)",     gb:6.5},
      {label:"Qwen3-8B(4bit)",        gb:6.0},
      {label:"Qwen3-8B(fp16)",        gb:16.5},
      {label:"Gemini-API",            gb:0.0, note:"VRAM 0 — 대신 네트워크·쿼터를 씁니다 (5-A)"}
    ],
    tts: [
      {label:"Kokoro(82M)",             gb:0.5},
      {label:"F5-TTS",                  gb:1.5},
      {label:"Chatterbox-Multilingual", gb:2.2},
      {label:"Fish-Speech-1.5",         gb:4.0},
      {label:"gTTS(API)",               gb:0.0, note:"VRAM 0 — 외부 API, 네트워크·품질 제약은 별도 (2장)"}
    ]
  };
  var PRESETS = {
    A: {name:"프리셋 A — 경량 실시간 상담 스택",
        asr:"faster-whisper-small(int8)", llm:"EXAONE-4.0-1.2B(fp16)", tts:"Kokoro(82M)"},
    B: {name:"프리셋 B — '좋은 건 다 넣은' 스택",
        asr:"faster-whisper-large-v3", llm:"Qwen3-8B(fp16)", tts:"F5-TTS"}
  };
  var KINDCOLOR = {asr:"var(--asr)", llm:"var(--llm)", tts:"var(--tts)"};
  var KINDNAME = {asr:"ASR", llm:"LLM", tts:"TTS"};

  var $ = function(id){ return document.getElementById(id); };
  var gauge=$("gauge"), stack=$("stack"), tank=$("tank"), rim=$("rim"), danger=$("danger");
  var totalEl=$("total"), capEl=$("cap"), rowsEl=$("rows"), comboNameEl=$("comboName");
  var stamp=$("stamp"), btnPlay=$("btnPlay"), btnA=$("btnA"), btnB=$("btnB"), btnR=$("btnR");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var playing = false, runId = 0;
  var selected = { asr: CATALOG.asr[0].label, llm: CATALOG.llm[0].label, tts: CATALOG.tts[0].label };

  // ── 칩 선택기 구성
  var chipEls = {asr:[], llm:[], tts:[]};
  function buildChips(kind, holderId){
    var holder = $(holderId);
    CATALOG[kind].forEach(function(m){
      var b = document.createElement("button");
      b.className = "chip"; b.type = "button";
      b.style.setProperty("--chipc", KINDCOLOR[kind]);
      b.innerHTML = m.label + '<span class="gb">' + m.gb.toFixed(1) + 'GB</span>';
      b.addEventListener("click", function(){
        if (playing) return;
        selected[kind] = m.label;
        syncChips();
      });
      holder.appendChild(b);
      chipEls[kind].push({el:b, label:m.label});
    });
  }
  function syncChips(){
    ["asr","llm","tts"].forEach(function(kind){
      chipEls[kind].forEach(function(c){
        c.el.classList.toggle("sel", c.label === selected[kind]);
      });
    });
  }
  function setChipsDisabled(dis){
    ["asr","llm","tts"].forEach(function(kind){
      chipEls[kind].forEach(function(c){ c.el.disabled = dis; });
    });
  }
  buildChips("asr","chipsAsr"); buildChips("llm","chipsLlm"); buildChips("tts","chipsTts");
  syncChips();

  function findModel(kind, label){
    for (var i=0;i<CATALOG[kind].length;i++)
      if (CATALOG[kind][i].label === label) return CATALOG[kind][i];
    return null;
  }
  function currentStack(){
    return ["asr","llm","tts"].map(function(kind){
      var m = findModel(kind, selected[kind]);
      return {label:m.label, kind:kind, gb:m.gb, note:m.note || null};
    });
  }

  // ── 고정 요소 배치: 한계선, 위험 영역, 탱크 벽, 눈금
  var rimBottom = T4 * PX;
  rim.style.bottom = rimBottom + "px";
  tank.style.height = rimBottom + "px";
  danger.style.bottom = rimBottom + "px";
  danger.style.top = "0";
  [0,4,8,12,16,20,24,28,32].forEach(function(gb){
    var t=document.createElement("div"); t.className="tickline"; t.style.bottom=(gb*PX)+"px";
    var l=document.createElement("div"); l.className="ticklabel"; l.style.bottom=(gb*PX)+"px";
    l.textContent = gb; gauge.appendChild(t); gauge.appendChild(l);
  });

  function sleep(ms){
    return new Promise(function(res){
      if (reduced) { res(); return; }
      setTimeout(res, ms);
    });
  }
  function fmt(x){ return (Math.round(x*10)/10).toFixed(1); }

  function countTo(target, ms){
    var from = parseFloat(totalEl.textContent) || 0;
    if (reduced || ms <= 0){ totalEl.textContent = fmt(target); return Promise.resolve(); }
    var t0 = performance.now(), myRun = runId;
    return new Promise(function(res){
      function tick(t){
        if (myRun !== runId) { res(); return; }
        var p = Math.min(1, (t - t0) / ms);
        totalEl.textContent = fmt(from + (target - from) * p);
        if (p < 1) requestAnimationFrame(tick); else res();
      }
      requestAnimationFrame(tick);
    });
  }

  function addSeg(gb, bg, hatched, label){
    var s=document.createElement("div"); s.className="seg"+(hatched?" margin":"");
    if (bg) s.style.background = bg;
    var h = gb * PX;
    if (label && h >= 24){
      var i=document.createElement("div"); i.className="in"; i.textContent=label; s.appendChild(i);
    }
    stack.appendChild(s);
    void s.offsetHeight;
    s.style.height = h + "px";
    return s;
  }

  function buildRows(models){
    rowsEl.innerHTML = "";
    var rows = [];
    models.forEach(function(m){
      var tr=document.createElement("tr");
      tr.innerHTML = '<td class="dot"><span></span></td>'
                   + '<td>' + KINDNAME[m.kind] + ' · ' + m.label + '</td>'
                   + '<td class="gb">' + fmt(m.gb) + ' GB</td>';
      rowsEl.appendChild(tr); rows.push(tr);
    });
    var trM=document.createElement("tr");
    trM.innerHTML='<td class="dot"><span></span></td><td>여유분 ×1.2 (활성값·단편화)</td><td class="gb" id="gbMargin">·</td>';
    var trC=document.createElement("tr");
    trC.innerHTML='<td class="dot"><span></span></td><td>CUDA 상주분</td><td class="gb">1.5 GB</td>';
    rowsEl.appendChild(trM); rowsEl.appendChild(trC);
    return {models: rows, margin: trM, cuda: trC};
  }

  function lightRow(tr, kind){
    tr.classList.add("on");
    var d = tr.querySelector(".dot span");
    if (d) d.style.background = kind ? (KINDCOLOR[kind] || "var(--cuda)") : "var(--cuda)";
  }

  function reset(){
    runId++;
    playing = false;
    btnPlay.disabled = btnA.disabled = btnB.disabled = false;
    setChipsDisabled(false);
    stack.innerHTML = ""; rowsEl.innerHTML = "";
    comboNameEl.innerHTML = "&nbsp;";
    totalEl.textContent = "0.0";
    capEl.textContent = "모델을 고르고 ▶ 재생을 누르세요";
    danger.style.opacity = 0;
    rim.classList.remove("flash");
    stamp.className = "stamp"; stamp.textContent = "";
    ["fSum","fMargin","fCuda","fNeed"].forEach(function(id){
      var e=$(id); e.classList.remove("show"); e.textContent="·";
    });
    var n=$("fNote"); n.className="note"; n.textContent="";
  }

  async function play(comboName){
    if (playing) return;
    reset();
    playing = true;
    btnPlay.disabled = btnA.disabled = btnB.disabled = true;
    setChipsDisabled(true);
    var myRun = runId;
    var models = currentStack();
    comboNameEl.innerHTML = "<b>" + (comboName ||
      models.map(function(m){ return m.label; }).join(" + ")) + "</b>";
    var rows = buildRows(models);
    var sum = 0, crossed = false;

    await sleep(500);

    // 1) 모델 블록 순차 적재
    for (var i=0;i<models.length;i++){
      if (myRun !== runId) return;
      var m = models[i];
      lightRow(rows.models[i], m.kind);
      capEl.textContent = m.label;
      if (m.gb > 0){
        addSeg(m.gb, KINDCOLOR[m.kind], false, fmt(m.gb)+" GB");
      } else if (m.note){
        var nI=$("fNote"); nI.textContent = m.label + ": " + m.note;
        nI.className = "note info show";
      }
      sum += m.gb;
      await countTo(sum, 650);
      if (!crossed && sum > T4){
        crossed = true;
        rim.classList.add("flash");
        danger.style.opacity = 1;
        rows.models[i].classList.add("warn");
        var n1=$("fNote");
        n1.textContent = (m.gb > T4 ? "이 블록 하나로 이미 한계선을 넘었습니다"
                                    : "여기서 한계선을 넘었습니다")
                       + " — 그래도 판정식은 끝까지 갑니다.";
        n1.className = "note show";
        await sleep(1300);
      }
      await sleep(450);
    }
    if (myRun !== runId) return;
    $("fSum").textContent = fmt(sum)+" GB"; $("fSum").classList.add("show");
    await sleep(650);

    // 2) ×1.2 여유분
    var margin = sum * 0.2;
    lightRow(rows.margin, null);
    $("gbMargin").textContent = "+" + fmt(margin) + " GB";
    capEl.textContent = "여유분 ×1.2 — 활성값과 메모리 단편화 몫";
    if (margin > 0) addSeg(margin, null, true, "+" + fmt(margin) + " GB");
    await countTo(sum + margin, 550);
    $("fMargin").textContent = "→ " + fmt(sum + margin); $("fMargin").classList.add("show");
    if (!crossed && sum + margin > T4){
      crossed = true; rim.classList.add("flash"); danger.style.opacity = 1;
    }
    await sleep(650);

    // 3) CUDA 상주분
    var need = sum * 1.2 + 1.5;
    lightRow(rows.cuda, null);
    capEl.textContent = "CUDA 상주분 +1.5GB — 모델이 0개여도 쓰는 몫";
    addSeg(1.5, "var(--cuda)", false, "CUDA 1.5 GB");
    await countTo(need, 550);
    $("fCuda").textContent = "→"; $("fCuda").classList.add("show");
    if (!crossed && need > T4){
      crossed = true; rim.classList.add("flash"); danger.style.opacity = 1;
    }
    await sleep(700);

    // 4) 판정
    if (myRun !== runId) return;
    var ok = need <= T4;
    $("fNeed").textContent = fmt(need) + " GB"; $("fNeed").classList.add("show");
    capEl.textContent = "판정: " + fmt(need) + " GB vs 16.0 GB";
    stamp.textContent = ok ? "✅ 통과 — " + fmt(need) + " GB ≤ 16 GB"
                           : "❌ 탈락 — " + fmt(need) + " GB > 16 GB";
    stamp.classList.add(ok ? "pass" : "fail");
    await sleep(80);
    stamp.classList.add("show");
    var n2=$("fNote");
    if (!ok){
      n2.textContent = "탈락 이유는 문장이 아니라 숫자로: '무거워서'가 아니라 '" + fmt(need) + "GB > 16GB라서'.";
      n2.className = "note show";
    } else {
      var apiModels = models.filter(function(m){ return m.gb === 0; })
                            .map(function(m){ return m.label; });
      if (apiModels.length){
        n2.textContent = apiModels.join(", ") + "는 VRAM 0으로 통과 — 대신 네트워크 지연·쿼터가 Gate 2와 리스크란으로 갑니다.";
        n2.className = "note info show";
      }
    }
    playing = false;
    btnPlay.disabled = btnA.disabled = btnB.disabled = false;
    setChipsDisabled(false);
  }

  function applyPreset(key){
    if (playing) return;
    var p = PRESETS[key];
    selected.asr = p.asr; selected.llm = p.llm; selected.tts = p.tts;
    syncChips();
    play(p.name);
  }

  btnPlay.addEventListener("click", function(){ play(null); });
  btnA.addEventListener("click", function(){ applyPreset("A"); });
  btnB.addEventListener("click", function(){ applyPreset("B"); });
  btnR.addEventListener("click", reset);
})();
</script>
</body>
</html>
